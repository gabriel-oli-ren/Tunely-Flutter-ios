name: Build iOS IPA

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile (development, preview, production)'
        required: false
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  build:
    name: Build iOS IPA
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Setup EAS CLI
        run: npm install -g eas-cli

      - name: 🔐 Setup environment variables
        run: |
          echo "EXPO_TOKEN=${{ secrets.EXPO_TOKEN }}" >> $GITHUB_ENV
          echo "EXPO_APPLE_ID=${{ secrets.EXPO_APPLE_ID }}" >> $GITHUB_ENV
          echo "EXPO_APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}" >> $GITHUB_ENV
          echo "EXPO_APPLE_TEAM_ID=${{ secrets.EXPO_APPLE_TEAM_ID }}" >> $GITHUB_ENV

      - name: 🍎 Build iOS IPA
        run: |
          PROFILE="${{ github.event.inputs.profile || 'production' }}"
          eas build --platform ios --profile "$PROFILE" --non-interactive --output ./tunely-ios.ipa
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.EXPO_APPLE_TEAM_ID }}

      - name: 📤 Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: tunely-ios-ipa-${{ github.sha }}
          path: ./tunely-ios.ipa
          retention-days: 30

      - name: 📋 Create build summary
        if: success()
        run: |
          echo "## 🎉 iOS Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: iOS" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Type**: ${{ github.event.inputs.profile || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact**: Download IPA from Artifacts section" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the IPA from the Artifacts section" >> $GITHUB_STEP_SUMMARY
          echo "2. Use tools like AltStore, Sideloadly, or Apple Configurator to install" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### iOS 26 Features" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Liquid Glass UI Components" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Native Haptic Feedback" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Dynamic Blur Effects" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Gradient Animations" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ YouTube Audio Streaming" >> $GITHUB_STEP_SUMMARY

  build-preview:
    name: Build iOS Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Setup EAS CLI
        run: npm install -g eas-cli

      - name: 🍎 Build iOS Preview
        run: eas build --platform ios --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📋 PR Comment
        uses: actions/github-script@v7
        if: success()
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 🎉 iOS Preview Build Completed!\n\nThe preview build has been created successfully. You can test it using the Expo Go app or download the IPA from the EAS dashboard.'
            })
